<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>SecondMonitor Hub</title>
    <style>
      /* Écran de chargement : visible avant que l'interface (React) ne démarre, remplacé par elle au premier rendu. */
      #sm-chargement { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0d0d; color: #e8e8e8;
        font: 15px/1.5 "Segoe UI", -apple-system, system-ui, Roboto, sans-serif; padding: 24px; text-align: center; }
      #sm-chargement .sm-aide { display: none; max-width: 520px; margin-top: 14px; color: #a8a8a8; }
      #sm-chargement .sm-aide b { color: #e8e8e8; user-select: all; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="sm-chargement">
        <div>
          <div>Chargement de SecondMonitor…</div>
          <div class="sm-aide" id="sm-chargement-aide">
            L'interface met du temps à démarrer. Ouvrez-la dans un navigateur (Chrome, Edge, Firefox, Safari) à l'adresse
            <b id="sm-chargement-adresse">http://127.0.0.1:8686</b>.
            Si la fenêtre reste vide, le journal (journal.txt, dossier des données de SecondMonitor) en donne la raison.
          </div>
        </div>
      </div>
    </div>
    <script>
      // Toujours rien au bout de 10 s (vue web trop ancienne, script bloqué) : on dit quoi faire.
      setTimeout(function () {
        if (!document.getElementById('sm-chargement')) return;
        var adresse = document.getElementById('sm-chargement-adresse');
        if (location.protocol.indexOf('http') === 0) adresse.textContent = location.protocol + '//' + location.host;
        document.getElementById('sm-chargement-aide').style.display = 'block';
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
