# SecondMonitor : tests à chaque envoi, construction de tous les systèmes à la demande et sur les étiquettes v*.
#
# - Windows et Linux se construisent sur Linux (machines GitHub toujours disponibles) : .NET compile pour tous.
# - Mac se construit à part sur macOS (application .app signée) : ces machines sont parfois saturées chez GitHub ;
#   si la file d'attente dépasse 45 min, ce seul système échoue, Windows et Linux sont quand même livrés.
#
# Lancée par le Publieur OneDrop3D (workflow_dispatch) : chaque système part dans une release provisoire
# « ci-<run>-secondmonitor-mac|windows|linux » (une archive .tar avec le dossier dist/), que le Publieur télécharge
# puis supprime. Pas d'artefacts : leur stockage est compté sur tout le compte.
# Lancée par une étiquette v* : les archives vont dans la release publique « v<version> » (préversion).
name: Construction
on:
  workflow_dispatch:
    inputs:
      systemes:
        description: "Systèmes à construire (mac, windows, linux), séparés par des virgules"
        required: false
        default: "mac,windows,linux"
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write   # releases (provisoires ou publiques)
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Tests du hub
        run: dotnet test Hub/SecondMonitorHub.sln
      - name: Compilation du collecteur
        run: dotnet build Collector/src -c Release

  # Liste des systèmes demandés : le Publieur OneDrop3D ne demande que ceux qu'il ne construit pas sur le Mac
  # (pas de machine macOS réservée pour rien, pas de release provisoire orpheline).
  plan:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      matrice: ${{ steps.m.outputs.matrice }}
    steps:
      - id: m
        env:
          DEMANDE: ${{ github.event.inputs.systemes || 'mac,windows,linux' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          tous = [
            {"systeme": "windows", "machine": "ubuntu-24.04", "commande": "win", "fichiers": "dist/SecondMonitor-*-windows-x64.zip"},
            {"systeme": "linux", "machine": "ubuntu-24.04", "commande": "linux", "fichiers": "dist/SecondMonitor-*-linux-x64.tar.gz"},
            {"systeme": "mac", "machine": "macos-latest", "commande": "mac", "fichiers": "dist/SecondMonitor-Hub-*-mac-*.zip"},
          ]
          voulus = {x.strip() for x in os.environ["DEMANDE"].split(",") if x.strip()}
          print("matrice=" + json.dumps({"include": [x for x in tous if x["systeme"] in voulus]}))
          PY

  construction:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrice) }}
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Outils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh zip
      - name: Construire (${{ matrix.systeme }})
        run: ./construire.sh ${{ matrix.commande }}

      - name: Envoi au Publieur (release provisoire)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOM: secondmonitor-${{ matrix.systeme }}
        run: |
          set -e
          tar -cf "$NOM.tar" ${{ matrix.fichiers }}
          tar -tvf "$NOM.tar"
          tag="ci-$GITHUB_RUN_ID-$NOM"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$NOM.tar" --clobber
          else
            gh release create "$tag" "$NOM.tar" --target "$GITHUB_SHA" --prerelease \
              --title "Construction $GITHUB_RUN_ID ($NOM)" \
              --notes "Transit vers le Publieur OneDrop3D : supprimée dès qu'elle est téléchargée."
          fi

      - name: Release publique
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          awk -v t="## Version $v" '$0==t{f=1;next} f&&/^## Version /{exit} f&&/^---$/{exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SecondMonitor $v" > notes.md
          # Release déjà publiée avec ses fichiers (par OneDrop3D ou à la main) : on n'y touche pas.
          n=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets | length' 2>/dev/null || echo 0)
          if [ "$n" -ge 6 ]; then echo "Release $GITHUB_REF_NAME déjà complète : fichiers conservés."; exit 0; fi
          # les trois systèmes se construisent en parallèle : le premier crée la release, les autres y ajoutent leurs fichiers
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --prerelease --title "SecondMonitor $v" --notes-file notes.md || true
          for i in 1 2 3 4 5; do
            gh release upload "$GITHUB_REF_NAME" ${{ matrix.fichiers }} --clobber && break
            sleep 10
          done
