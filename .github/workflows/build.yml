# SecondMonitor : tests à chaque envoi, construction de tous les systèmes à la demande et sur les étiquettes v*.
#
# Chaque système donne UN téléchargement qui installe les DEUX applications (SecondMonitor + SecondMonitor Collecteur) :
# - Mac : image disque .dmg (construite sur macOS, applications signées) ;
# - Windows : dossier .zip construit sur Linux, puis installateur .exe fabriqué par Inno Setup sur Windows ;
# - Linux : archive .tar.gz avec installer.sh (construite sur Linux).
#
# Lancée par le Publieur OneDrop3D (workflow_dispatch) : chaque système part dans une release provisoire
# « ci-<run>-secondmonitor-mac|windows|linux » (une archive .tar avec les fichiers de dist/), que le Publieur télécharge
# puis supprime. Seul le dossier Windows passe d'une machine à l'autre par un artefact gardé un jour.
# Lancée par une étiquette v* : les fichiers vont dans la release publique « v<version> » (préversion).
name: Construction
on:
  workflow_dispatch:
    inputs:
      systemes:
        description: "Systèmes à construire (mac, windows, linux), séparés par des virgules"
        required: false
        default: "mac,windows,linux"
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write   # releases (provisoires ou publiques)
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Tests du hub
        run: dotnet test Hub/SecondMonitorHub.sln
      - name: Compilation du collecteur
        run: dotnet build Collector/src -c Release

  # Liste des systèmes demandés : le Publieur OneDrop3D ne demande que ceux qu'il ne construit pas sur le Mac.
  plan:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      matrice: ${{ steps.m.outputs.matrice }}
      windows: ${{ steps.m.outputs.windows }}
    steps:
      - id: m
        env:
          DEMANDE: ${{ github.event.inputs.systemes || 'mac,windows,linux' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          tous = [
            {"systeme": "windows", "machine": "ubuntu-24.04", "commande": "win", "fichiers": "dist/SecondMonitor-*-windows-x64.zip"},
            {"systeme": "linux", "machine": "ubuntu-24.04", "commande": "linux", "fichiers": "dist/SecondMonitor-*-linux-x64.tar.gz"},
            {"systeme": "mac", "machine": "macos-latest", "commande": "mac", "fichiers": "dist/SecondMonitor-*-mac-*.dmg"},
          ]
          voulus = {x.strip() for x in os.environ["DEMANDE"].split(",") if x.strip()}
          print("matrice=" + json.dumps({"include": [x for x in tous if x["systeme"] in voulus]}))
          print("windows=" + ("true" if "windows" in voulus else "false"))
          PY

  construction:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrice) }}
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Outils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh zip
      # Mac : identité de signature STABLE si les secrets existent (packaging/mac/creer-identite-signature.sh --github).
      # Sans elle, signature ad hoc : macOS redemande le micro et le réseau local à chaque nouvelle version.
      - name: Identité de signature Mac (facultative)
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MAC_SIGN_P12 }}
          MDP: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
          NOM: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          if [ -z "$P12" ]; then echo "Pas d'identité de signature dans les secrets : signature ad hoc."; exit 0; fi
          k="$RUNNER_TEMP/signature.keychain-db"
          security create-keychain -p ci "$k"
          security set-keychain-settings -lut 21600 "$k"
          security unlock-keychain -p ci "$k"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/identite.p12"
          security import "$RUNNER_TEMP/identite.p12" -k "$k" -P "$MDP" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/identite.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$k" >/dev/null
          security list-keychains -d user -s "$k" $(security list-keychains -d user | tr -d '"')
          echo "ONEDROP3D_SIGN_IDENTITY=${NOM:-OneDrop3D SecondMonitor}" >> "$GITHUB_ENV"
      - name: Construire (${{ matrix.systeme }})
        run: ./construire.sh ${{ matrix.commande }}

      # Windows : le dossier part vers la machine Windows qui fabrique l'installateur.
      - name: Contrôle du paquet Linux
        if: matrix.systeme == 'linux'
        run: |
          set -e
          d="$RUNNER_TEMP/controle"; mkdir -p "$d"; tar -xzf dist/SecondMonitor-*-linux-x64.tar.gz -C "$d"
          file "$d/secondmonitor/SecondMonitorHub" "$d/secondmonitor/SecondMonitor-Collecteur" | tee /dev/stderr | grep -c "ELF 64-bit" | grep -qx 2
          test -x "$d/secondmonitor/installer.sh" && test -x "$d/secondmonitor/SecondMonitorHub"
          sh -n "$d/secondmonitor/installer.sh" && sh -n "$d/secondmonitor/desinstaller.sh"
          # Installation et désinstallation réelles dans un dossier personnel jetable (sans écran : pas de fenêtre).
          HOME="$RUNNER_TEMP/maison" XDG_DATA_HOME= "$d/secondmonitor/installer.sh" --silencieux --demarrage-auto </dev/null
          test -f "$RUNNER_TEMP/maison/.local/share/applications/secondmonitor.desktop"
          test -f "$RUNNER_TEMP/maison/.config/autostart/secondmonitor-collecteur.desktop"
          HOME="$RUNNER_TEMP/maison" "$d/secondmonitor/installer.sh" --verifier </dev/null || true
          echo '{"webPort": 8690, "enableHttps": false}' > "$RUNNER_TEMP/settings.json"; mkdir -p "$RUNNER_TEMP/donnees"; mv "$RUNNER_TEMP/settings.json" "$RUNNER_TEMP/donnees/"
          SMHUB_DATA="$RUNNER_TEMP/donnees" "$RUNNER_TEMP/maison/.local/share/secondmonitor/SecondMonitorHub" --sans-fenetre & p=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8690/api/update >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8690/api/status | head -c 300; echo
          curl -fs -X POST http://127.0.0.1:8690/api/quit; wait $p || true
          HOME="$RUNNER_TEMP/maison" "$RUNNER_TEMP/maison/.local/share/secondmonitor/desinstaller.sh"
          test ! -e "$RUNNER_TEMP/maison/.local/share/secondmonitor"

      - name: Dossier Windows pour l'installateur
        if: matrix.systeme == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/SecondMonitor-*-windows-x64.zip
          retention-days: 1
          compression-level: 0

      - name: Envoi au Publieur (release provisoire)
        if: github.event_name == 'workflow_dispatch' && matrix.systeme != 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOM: secondmonitor-${{ matrix.systeme }}
        run: |
          set -e
          tar -cf "$NOM.tar" ${{ matrix.fichiers }}
          tar -tvf "$NOM.tar"
          tag="ci-$GITHUB_RUN_ID-$NOM"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$NOM.tar" --clobber
          else
            gh release create "$tag" "$NOM.tar" --target "$GITHUB_SHA" --prerelease \
              --title "Construction $GITHUB_RUN_ID ($NOM)" \
              --notes "Transit vers le Publieur OneDrop3D : supprimée dès qu'elle est téléchargée."
          fi

      - name: Release publique
        if: startsWith(github.ref, 'refs/tags/v') && matrix.systeme != 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/release-publique.sh ${{ matrix.fichiers }}

  installateur-windows:
    needs: [plan, construction]
    if: always() && needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /? | Select-Object -First 1
      - name: Installateur
        shell: pwsh
        run: |
          $v = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Hub/Directory.Build.props -Raw)).Groups[1].Value
          $zip = Get-ChildItem dist/SecondMonitor-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dist/windows-x64 -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$v" "/DSource=$PWD\dist\windows-x64\SecondMonitor" "/DSortie=$PWD\dist" packaging\windows\SecondMonitor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/*.exe, dist/*.zip | Format-Table Name, Length

      - name: Envoi au Publieur (release provisoire)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOM: secondmonitor-windows
        run: |
          set -e
          tar -cf "$NOM.tar" dist/SecondMonitor-*-windows-x64.zip dist/SecondMonitor-*-windows-x64-installation.exe
          tar -tvf "$NOM.tar"
          tag="ci-$GITHUB_RUN_ID-$NOM"
          gh release create "$tag" "$NOM.tar" --target "$GITHUB_SHA" --prerelease \
            --title "Construction $GITHUB_RUN_ID ($NOM)" \
            --notes "Transit vers le Publieur OneDrop3D : supprimée dès qu'elle est téléchargée."

      - name: Release publique
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/release-publique.sh dist/SecondMonitor-*-windows-x64.zip dist/SecondMonitor-*-windows-x64-installation.exe
