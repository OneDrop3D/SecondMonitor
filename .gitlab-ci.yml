image: bash:latest

workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - external
  - deploy

external:
  stage: external
  script: 
    - |
      echo "Run External"

download_latestMaster:
  only:    
    - tags
  except:
    - branches
  stage: deploy    
  script:
    - sleep 60
    - |
      apk add wget curl
      wget -O SecondMonitor.msi --header="JOB-TOKEN: $CI_JOB_TOKEN" https://ci.appveyor.com/api/projects/Winzarten/secondmonitor-v47od/artifacts/Installer%2FSecondMonitor.msi?tag=${CI_COMMIT_TAG}
      curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file SecondMonitor.msi "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/SecondMonitor.msi/${CI_COMMIT_TAG}/SecondMonitor.msi"

pages:
  stage: deploy
  script:
    - mkdir .public
    - cp -r * .public
    - mv .public public
  artifacts:
    paths:
      - public
  only:
    - master    
    